<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="loader-container">
    <div class="spinner"></div>
  </div>

  <nav class="navbar">
    <div class="nav-brand">TechSA</div>
    <ul class="nav-links">
      <li><a href="#" class="nav-link">Home</a></li>
      <li><a href="#" class="nav-link">Products</a></li>
      <li><a href="#" class="nav-link">Deals</a></li>
      <li><a href="#" class="nav-link">Contact</a></li>
    </ul>
  </nav>
  
  <div class="container">
    <div class="hero_section">
      <h1 class="title">Tech Products</h1>
      <p class="description">Selling various tech products across South Africa</p>
      <div class="decorative-badge"><span>New Deals</span></div>
    </div>
  </div>
  
   <section class="product-grid">
      <article class="product-card">
        <img src="gaming_headset.webp" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Wireless Headphones</h2>
          <p class="card-price">R300</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card">
        <img src="speaker.webp" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Bluetooth Speaker</h2>
          <p class="card-price">R350</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card">
        <img src="gaming_keyboard.jpg" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Keyboard</h2>
          <p class="card-price">R400</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card"> 
        <img src="wireless_charger.jpg" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Wireless Charger</h2>
          <p class="card-price">R250</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card"> 
        <img src="external_hard_drive.jpg" class="card-img">
        <div class="card-body">
          <h2 class="card-title">1tb Hardrive</h2>
          <p class="card-price">R600</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card"> 
        <img src="gaming_mouse.jpg" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Gaming Mouse</h2>
          <p class="card-price">R450</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>
    </section>
  
</body>
</html>
